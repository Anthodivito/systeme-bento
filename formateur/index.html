<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Formateur">
<meta name="theme-color" content="#0A0B0D">
<title>Formateur d'Emails</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#0A0B0D; --panel:#101216; --panel2:#15181D; --raise:#1A1E24;
  --line:#21252C; --line2:#2C323B;
  --txt:#E7E9EC; --dim:#8A929E; --dim2:#5F6773;
  --gold:#C6A15B; --gold-lo:#8A7030; --gold-hi:#E4C88A;
  --ok:#4FB286; --warn:#D9A441; --crit:#D9614C;
  --serif:'Instrument Serif',ui-serif,Georgia,serif;
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:54px; --side:462px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink); color:var(--txt);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::selection{background:rgba(198,161,91,.28)}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- SHELL ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--side);height:100vh;height:100dvh}
.app.wide{grid-template-columns:var(--rail) minmax(0,1fr)}
.app.wide .main{display:none}

/* ---------- RAIL ---------- */
.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;z-index:22}
.rail .mark{font-family:var(--serif);font-size:20px;color:var(--gold);line-height:1;margin-bottom:14px;user-select:none}
.rail button{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--dim2);transition:.15s}
.rail button:hover{color:var(--txt);background:var(--raise)}
.rail button.on{color:var(--gold-hi);background:rgba(198,161,91,.12)}
.rail button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail .sp{flex:1}

/* ---------- EDITEUR ---------- */
.main{display:flex;flex-direction:column;min-width:0;background:var(--ink)}
.bar{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.bar h1{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.01em}
.bar .sp{flex:1}
.btn{padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:500;border:1px solid var(--line2);color:var(--dim);transition:.15s;white-space:nowrap}
.btn:hover{border-color:#3A414C;color:var(--txt)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#17130A;font-weight:600}
.btn.pri:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.sm{padding:5px 10px;font-size:11.5px}

.subject{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.subject input{flex:1;min-width:0;background:none;border:none;font-size:14.5px;font-weight:500;letter-spacing:-.005em}
.subject input::placeholder{color:var(--dim2);font-weight:400}
.meter{display:flex;align-items:center;gap:7px;flex:none}
.meter .track{width:64px;height:3px;border-radius:2px;background:var(--line2);overflow:hidden}
.meter .fill{height:100%;background:var(--ok);width:0;transition:width .2s,background .2s}
.meter .n{font-size:11px;color:var(--dim2)}

.editwrap{flex:1;min-height:0;position:relative;display:flex}
#body{flex:1;background:none;border:none;resize:none;padding:20px 22px 60px;font-size:15px;line-height:1.85;letter-spacing:.002em}
#body::placeholder{color:var(--dim2)}
#body:focus{outline:none}
.hint{position:absolute;left:22px;bottom:14px;font-size:11px;color:var(--dim2);pointer-events:none}
.hint kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-radius:4px;padding:1px 4px;color:var(--dim)}

.status{display:flex;gap:18px;padding:9px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--dim2);flex-wrap:wrap}
.status b{color:var(--dim);font-weight:600}
.status .ok{color:var(--ok)}.status .warn{color:var(--warn)}.status .crit{color:var(--crit)}

/* ---------- PANNEAU ---------- */
.side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.shead{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.shead .sp{flex:1}
.seg{display:inline-flex;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:5px 9px;border-radius:6px;font-size:11px;color:var(--dim2);transition:.12s}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--raise);color:var(--gold-hi);font-weight:600}
.icobtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--dim2)}
.icobtn:hover{background:var(--raise);color:var(--txt)}
.icobtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 14px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--ink)}
.stage::-webkit-scrollbar{width:8px}
.stage::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.ruler{width:100%;max-width:420px;display:flex;align-items:center;gap:8px;color:var(--dim2);font-size:10px}
.ruler .l{flex:1;height:1px;background:var(--line2);position:relative}
.ruler .l::before,.ruler .l::after{content:'';position:absolute;top:-3px;width:1px;height:7px;background:var(--line2)}
.ruler .l::before{left:0}.ruler .l::after{right:0}
.scaler{transform-origin:top left;flex:none}

.phone{position:relative;background:#fff;border-radius:38px;border:10px solid #0F1013;box-shadow:0 18px 44px rgba(0,0,0,.55);overflow:hidden}
.phone .sb{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:600 13px/1 -apple-system,system-ui,sans-serif;color:#111}
.phone .gh{background:#F6F8FC;border-bottom:1px solid #E4E7EE;padding:9px 14px;font-size:13px;color:#3C4043;display:flex;gap:8px}
.phone .gb{padding:16px;color:#202124;font:16px/1.55 -apple-system,system-ui,'Roboto',sans-serif;height:392px;overflow:auto}
.desk{position:relative;background:#fff;border:1px solid #D6DAE1;border-radius:8px;box-shadow:0 18px 44px rgba(0,0,0,.5);overflow:hidden}
.desk .gh{background:#F6F8FC;border-bottom:1px solid #E4E7EE;padding:10px 16px;font-size:13px;color:#3C4043}
.desk .gb{padding:24px 28px;color:#202124;font:14px/1.6 'Roboto',Arial,sans-serif;height:300px;overflow:auto}
.phone::after,.desk::after{content:'';position:absolute;left:0;right:0;bottom:0;height:28px;pointer-events:none;background:linear-gradient(rgba(255,255,255,0),#fff)}
.dark .phone::after,.dark .desk::after{background:linear-gradient(rgba(27,28,30,0),#1B1C1E)}
.pctrl.off{display:none}
.dark .phone,.dark .desk{background:#1B1C1E}
.dark .phone .sb{background:#1B1C1E;color:#E8EAED}
.dark .gh{background:#26282B;border-color:#3C4043;color:#C4C7C5}
.dark .gb{background:#1B1C1E;color:#E3E3E3}
.mailbody b{font-weight:700}
.mailbody p{margin:0 0 15px}
.mailbody ul{margin:0 0 15px;padding-left:22px}
.mailbody li{margin:0 0 5px}
.mailbody .sig{color:inherit;font-size:inherit}

.readout{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel)}
.readout div{text-align:center;min-width:52px}
.readout .v{display:block;font-family:var(--mono);font-size:15px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.readout .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}

.pctrl{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pctrl label{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim2);flex:0 1 420px;min-width:150px}
.pctrl input[type=range]{flex:1;min-width:70px;accent-color:var(--gold);height:2px}
.pctrl .num{color:var(--gold-hi);font-size:11px}
/* ---------- INSPECTEUR ---------- */
.insp{flex:1;overflow-y:auto;padding:12px 14px 20px;display:none;flex-direction:column;gap:6px}
.insp.on{display:flex}
.stage.off,.readout.off{display:none}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--panel2);border:1px solid transparent}
.row:hover{border-color:var(--line2)}
.row .t{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.off .t{color:var(--dim2);text-decoration:line-through}
.row .ty{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);flex:none}
.row .c{font-family:var(--mono);font-size:10px;color:var(--dim2);flex:none}
.sw{width:30px;height:17px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:.18s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--dim);transition:.18s}
.sw.on{background:rgba(198,161,91,.45)}
.sw.on::after{left:15px;background:var(--gold-hi)}
.insp .grp{display:flex;align-items:center;gap:8px;margin:10px 2px 4px}
.insp .grp .ln{flex:1;height:1px;background:var(--line)}
.dico{display:flex;gap:6px;margin-top:4px}
.dico input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px}
.dico input:focus{outline:none;border-color:var(--gold-lo)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 9px;font-size:11px;color:var(--dim)}
.tag button{color:var(--dim2);font-size:13px;line-height:1}
.tag button:hover{color:var(--crit)}
.empty{color:var(--dim2);font-size:12px;padding:14px 2px;text-align:center}


/* ---------- FENÊTRE GMAIL BUREAU ---------- */
.gwin{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.5);color:#202124;font-family:'Roboto',Arial,sans-serif;position:relative}
.gwin .gtop{display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:1px solid #EDEFF2;height:56px}
.gwin .glogo{font-size:20px;color:#5F6368;letter-spacing:-.02em;width:190px;display:flex;align-items:center;gap:14px}
.gwin .gsearch{flex:1;max-width:720px;background:#EAF1FB;border-radius:8px;height:40px;display:flex;align-items:center;padding:0 14px;color:#5F6368;font-size:14px;gap:10px}
.gwin .gav{width:32px;height:32px;border-radius:50%;background:#8E6E3C;color:#fff;display:grid;place-items:center;font-size:14px;margin-left:auto;flex:none}
.gwin .gmain{display:grid;grid-template-columns:212px 1fr}
.gwin .gnav{padding:12px 8px 20px}
.gwin .gcomp{display:inline-flex;align-items:center;gap:10px;background:#C2E7FF;border-radius:16px;padding:12px 20px;font-size:14px;color:#001D35;margin:0 8px 14px}
.gwin .gitem{display:flex;align-items:center;gap:16px;padding:7px 12px;border-radius:0 16px 16px 0;font-size:14px;color:#202124}
.gwin .gitem.on{background:#D3E3FD;font-weight:700}
.gwin .gitem .n{margin-left:auto;font-size:12px;color:#5F6368}
.gwin .gread{padding:8px 28px 28px;min-width:0}
.gwin .gtools{display:flex;gap:18px;color:#5F6368;font-size:13px;padding:6px 0 14px;border-bottom:1px solid #F1F3F4;margin-bottom:16px}
.gwin .gsubj{font-size:22px;font-weight:400;color:#202124;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.gwin .gchip{font-size:11px;background:#E8EAED;color:#3C4043;border-radius:4px;padding:2px 6px}
.gwin .gfrom{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.gwin .gfrom .av{width:38px;height:38px;border-radius:50%;background:#8E6E3C;color:#fff;display:grid;place-items:center;font-size:16px;flex:none}
.gwin .gfrom .who{font-size:14px;font-weight:700}
.gwin .gfrom .who span{font-weight:400;color:#5F6368}
.gwin .gfrom .to{font-size:12px;color:#5F6368}
.gwin .gfrom .date{margin-left:auto;font-size:12px;color:#5F6368;white-space:nowrap}
.gwin .gbody{font-size:14px;line-height:1.6;color:#202124;padding-left:52px}
.gwin .gacts{display:flex;gap:10px;padding:22px 0 0 52px}
.gwin .gact{border:1px solid #DADCE0;border-radius:18px;padding:7px 22px;font-size:14px;color:#3C4043}
.dark .gwin{background:#1B1C1E;color:#E3E3E3}
.dark .gwin .gtop{border-color:#333438}
.dark .gwin .gsearch{background:#2F3033;color:#C4C7C5}
.dark .gwin .gitem{color:#E3E3E3}
.dark .gwin .gitem.on{background:#004A77}
.dark .gwin .gcomp{background:#004A77;color:#C2E7FF}
.dark .gwin .gsubj,.dark .gwin .gbody,.dark .gwin .gfrom .who{color:#E3E3E3}
.dark .gwin .gtools{border-color:#333438}
.dark .gwin .gchip{background:#333438;color:#C4C7C5}
.dark .gwin .gact{border-color:#5F6368;color:#A8C7FA}
.gwin::after{content:'';position:absolute;left:0;right:0;bottom:0;height:24px;pointer-events:none;background:linear-gradient(rgba(255,255,255,0),#fff)}
.dark .gwin::after{background:linear-gradient(rgba(27,28,30,0),#1B1C1E)}
.mailbody a{color:#1A73E8;text-decoration:underline}
.dark .mailbody a{color:#A8C7FA}

/* ---------- LIENS ---------- */
.lnk{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;background:var(--panel2);margin-bottom:6px}
.lnk .e{font-size:15px;flex:none}
.lnk .m{flex:1;min-width:0}
.lnk .m .t{font-size:12.5px}
.lnk .m .u{font-size:10.5px;color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
.lnk .go{color:var(--gold);font-size:11px;font-weight:600;flex:none}
.lnkform{display:grid;grid-template-columns:46px 1fr;gap:6px;margin-top:8px}
.lnkform input{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px}
.lnkform input:focus{outline:none;border-color:var(--gold-lo)}
.lnkform .full{grid-column:1/-1}
.zoomtag{position:absolute;right:10px;top:10px;cursor:pointer;border:1px solid var(--line2);background:rgba(10,11,13,.72);color:var(--gold-hi);font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:6px;z-index:3}
.stagewrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- TIROIR ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,7,9,.6);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:var(--rail);bottom:0;width:340px;max-width:88vw;background:var(--panel);border-right:1px solid var(--line);z-index:21;transform:translateX(-100%);transition:transform .24s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h2{font-family:var(--serif);font-size:20px;font-weight:400;flex:1}
.drawer .dc{flex:1;overflow-y:auto;padding:10px 12px 20px}
.item{width:100%;text-align:left;padding:10px 12px;border-radius:9px;border:1px solid transparent;transition:.15s}
.item:hover{background:var(--panel2);border-color:var(--line2)}
.item .n{font-size:13px;font-weight:600}
.item .d{font-size:11.5px;color:var(--dim2);margin-top:2px}
.item .k{float:right;font-family:var(--mono);font-size:10px;color:var(--dim2)}

.item.used{background:rgba(198,161,91,.16);border-color:var(--gold-lo)}
.item.used .n::after{content:' ✓';color:var(--gold-hi)}
.lnk .go.used{color:var(--ok)}
.drawer .df{border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--dim2);flex:none}
.drawer .df .sp{flex:1}
.drawer .df b{color:var(--gold-hi);font-family:var(--mono)}
/* ---------- TOAST ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,90px);background:var(--raise);border:1px solid var(--line2);color:var(--txt);padding:11px 18px;border-radius:11px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.34,1.4,.64,1);z-index:40;display:flex;gap:9px;align-items:center;max-width:88vw}
.toast.on{transform:translate(-50%,0)}
.toast .i{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.toast.err .i{background:var(--crit)}
#clip{position:fixed;left:-9999px;top:0;background:#fff;color:#000;-webkit-text-fill-color:#000}

/* ---------- MOBILE ---------- */
.tabbar{display:none}
@media(max-width:980px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
  .app.wide{grid-template-columns:1fr}
  .drawer{left:0}
  .rail{flex-direction:row;width:100%;border-right:none;border-bottom:1px solid var(--line);padding:8px 10px;gap:2px;justify-content:flex-start}
  .rail .mark{margin:0 8px 0 4px;font-size:18px}
  .side{border-left:none;border-top:1px solid var(--line);display:none}
  .app[data-view="desk"] .side,.app[data-view="phone"] .side,.app[data-view="bold"] .side{display:flex}
  .app[data-view="desk"] .main,.app[data-view="phone"] .main,.app[data-view="bold"] .main{display:none}
  .tabbar{display:flex;gap:2px;padding:6px;background:var(--panel);border-top:1px solid var(--line);padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;padding:9px;border-radius:9px;font-size:12px;color:var(--dim2)}
  .tabbar button.on{background:var(--raise);color:var(--gold-hi);font-weight:600}
  .hint{display:none}
  .bar{padding:10px 12px;gap:8px;flex-wrap:nowrap}
  .bar h1,.bar .dot{display:none}
  .btn{padding:8px 11px;font-size:12px}
  #body{padding:16px 16px 30px;font-size:16px}
}
</style>
</head>
<body>
<div class="app" id="app" data-view="edit">

  <nav class="rail">
    <div class="mark">A</div>
    <button id="btnTpl" title="Modèles et blocs"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg></button>
    <button id="btnLink" title="Mes liens"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
    <button id="btnIA" title="Assistant IA"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg></button>
    <button id="btnPara" title="Structurer en paragraphes"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 10h14M5 15h9M5 20h6"/></svg></button>
    <button id="btnClean" title="Nettoyer la typographie"><svg viewBox="0 0 24 24"><path d="M4 20l6-6M14 4l6 6-9 9H5v-6z"/></svg></button>

/* ========== NETTOYAGE TYPOGRAPHIQUE ========== */
function nettoyer(t){
  var n=t.replace(/\r\n?/g,'\n')
    .replace(/[\u200B-\u200D\uFEFF\u2060]/g,'')
    .replace(/\u00A0/g,' ').replace(/[ \t]+/g,' ').replace(/ +$/gm,'')
    .replace(/\n{3,}/g,'\n\n').replace(/\.\.\./g,'…');
  n=n.replace(/"([^"\n]{1,200})"/g,'« $1 »').replace(/'/g,'\u2019');
  n=n.replace(/\s*([;:!?%])/g,'\u202F$1').replace(/\u202F:\/\//g,'://');
  n=n.replace(/«\s*/g,'«\u202F').replace(/\s*»/g,'\u202F»');
  n=n.replace(/^[ \t]*[*•·]\s+/gm,'– ').replace(/^[ \t]*-\s+/gm,'– ');
  return n.trim();
}

/* ========== LEXIQUES ========== */
var L='A-Za-zÀ-ÖØ-öø-ÿ';
var B='(^|[^0-9'+L+'])';
var MOIS='(?:janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre)';
var JOURS='(?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)';
var NBL='(?:une?|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|onze|douze|quinze|vingt|trente)';
var UNITE='(?:demi-journées?|journées?|jours?|heures?|semaines?|mois|minutes?|lieux|sites?|photos?|images?|clichés?|tenues?|personnes?|invités?)';
var LIVRABLE=['droits? d’usage','droits? d’auteur','cession de droits','haute définition','pièces? jointes?','galerie privée','galerie en ligne','planche-contact','prises? de vue','séance photo','retouche éditoriale','tarif préférentiel','frais de déplacement','devis détaillé','bon pour accord','repérages?','déroulé','livraison','galerie','retouches?','devis','acompte','solde','facture','forfait','prestation','portfolio','accréditation','week-end'];
var VALEUR=['sans engagement','sans frais supplémentaires','tout premier','en avant-première','illimité(?:e|s|es)?','exclusivité','exclusif','exclusive','inclus(?:e|es)?','offert(?:e|es|s)?','gratuit(?:e|s)?','préférentiel(?:le)?','exceptionnel(?:le)?','prioritaire'];
function alt(a){return '(?:'+a.join('|')+')';}
function rx(b,f){return new RegExp(B+'('+b+')',f||'gi');}
function rxw(b,f){return new RegExp(B+'('+b+')(?![0-9'+L+'])',f||'gi');}

var PATS=[
 {ty:'montant', p:1, re:rx('(?:\\d{1,3}(?:[  \\u00A0\\u202F]\\d{3})+|\\d+)(?:[.,]\\d{1,2})?\\s?(?:€|EUR|euros?)(?:\\s+(?:net|nets|HT|TTC))?')},
 {ty:'montant', p:1, re:rx('(?:€|\\$)\\s?\\d[\\d  .,]*')},
 {ty:'échéance',p:2, re:rx('(?:avant le|au plus tard le|jusqu’au|jusqu\'au|d’ici le|d\'ici le)\\s+\\d{1,2}(?:er)?(?:\\s+'+MOIS+')?(?:\\s+\\d{4})?')},
 {ty:'date',    p:3, re:rx('(?:'+JOURS+'\\s+)?\\d{1,2}(?:er)?\\s+'+MOIS+'(?:\\s+\\d{4})?')},
 {ty:'date',    p:3, re:rx(JOURS+'\\s+\\d{1,2}(?:er)?\\s+'+MOIS)},
 {ty:'date',    p:3, re:rx('\\d{1,2}[\\/.-]\\d{1,2}[\\/.-]\\d{2,4}')},
 {ty:'horaire', p:4, re:new RegExp(B+'(\\d{1,2}\\s?[hH](?:\\s?[0-5]\\d)?)(?![0-9'+L+'])','g')},
 {ty:'horaire', p:4, re:rx('\\d{1,2}:[0-5]\\d')},
 {ty:'délai',   p:5, re:rxw('(?:sous|dans|d’ici|d\'ici|en)\\s+(?:\\d{1,3}|'+NBL+')\\s+(?:heures?|jours?|semaines?|mois|minutes?)')},
 {ty:'quantité',p:6, re:rxw('(?:\\d{1,4}|'+NBL+')\\s+'+UNITE)},
 {ty:'lieu',    p:8, re:rx('(?:à|au|aux|chez|vers|entre|jusqu’à|jusqu\'à|depuis)\\s+[A-ZÀ-Ö][’\'\\-'+L+']+(?:[ \\-][A-ZÀ-Ö][’\'\\-'+L+']+)?','g')},
 {ty:'lieu',    p:8, re:rx('(?:plage|hôtel|château|villa|domaine|palais|parc|mairie|salle|région|port|cap|rooftop)\\s+(?:du |de la |de |d’|d\'|des )?[A-ZÀ-Ö][’\'\\-'+L+']+')},
 {ty:'livrable',p:9, re:rxw(alt(LIVRABLE))},
 {ty:'valeur',  p:10,re:rxw(alt(VALEUR))}
];
var STOP=/^(madame|monsieur|mme|mlle|bonjour|cordialement|merci|janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)$/i;
var FIN=/^\s*(bien à vous|bien a vous|cordialement|bien cordialement|très cordialement|tres cordialement|en vous souhaitant|à bientôt|a bientot|merci d.avance|amicalement|--|—|au plaisir)/i;

var CAPL=[2,3,4], CAPD=[0.08,0.13,0.20];
var NIVEAU=['sobre','équilibré','appuyé'];
var OFF_ORDER=['valeur','livrable','lieu','quantité','délai','dictionnaire','horaire','date','échéance','montant'];
var ACTIF={sobre:{},equil:{lieu:1,livrable:1},app:{lieu:1,livrable:1,valeur:1}};
function catOn(ty){
  if(ty==='valeur')return LEVEL>=2;
  if(ty==='lieu'||ty==='livrable')return LEVEL>=1;
  return true;
}

/* ========== ANALYSE ========== */
var DET=[],DROP=[];
function pushDet(t,ty){
  var k=norm(t);
  for(var i=0;i<DET.length;i++)if(DET[i].k===k){DET[i].n++;return;}
  DET.push({k:k,t:t,ty:ty,n:1,off:REFUS.indexOf(k)>-1});
}
/* découpe les marqueurs **gras** et [texte](url) */
function parseLine(s){
  var out='',marks=[],pos=0,m,re=/\*\*([\s\S]+?)\*\*|\[([^\]\n]+)\]\(([^)\s]+)\)/g;
  while((m=re.exec(s))!==null){
    out+=s.slice(pos,m.index);var st=out.length;
    if(m[1]!==undefined){out+=m[1];marks.push({s:st,e:out.length,k:'b',ty:'manuel'});}
    else{out+=m[2];marks.push({s:st,e:out.length,k:'a',u:m[3],ty:'lien'});}
    pos=m.index+m[0].length;
  }
  return {l:out+s.slice(pos),m:marks};
}
function inline(raw,marks,dis,collect){
  var taken=new Array(raw.length).fill(false),keep=[],auto=0,bw=0;
  function words(t){return (t.match(/\S+/g)||[]).length;}
  function claim(s,e,ty,kind){
    if(s<0||e>raw.length||e<=s)return false;
    for(var i=s;i<e;i++)if(taken[i])return false;
    for(var i=s;i<e;i++)taken[i]=true;
    keep.push({s:s,e:e,k:kind||'b',u:null,ty:ty});
    if(kind!=='a')bw+=words(raw.slice(s,e));
    return true;
  }
  for(var i=0;i<marks.length;i++){
    var mk=marks[i];
    if(claim(mk.s,mk.e,mk.ty,mk.k))keep[keep.length-1].u=mk.u||null;
  }
  for(var d=0;d<DICO.length;d++){
    if(!DICO[d])continue;
    var re=new RegExp(B+'('+DICO[d].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),m;
    while((m=re.exec(raw))!==null){
      var s=m.index+m[1].length,e=s+m[2].length,t=raw.slice(s,e);
      if(collect)pushDet(t,'dictionnaire');
      if(!dis['dictionnaire']&&REFUS.indexOf(norm(t))<0&&auto<CAPL[LEVEL]){if(claim(s,e,'dictionnaire'))auto++;}
      if(m.index===re.lastIndex)re.lastIndex++;
    }
  }
  var cands=[];
  for(var p=0;p<PATS.length;p++){
    if(!catOn(PATS[p].ty))continue;
    var re2=new RegExp(PATS[p].re.source,PATS[p].re.flags),m2;
    while((m2=re2.exec(raw))!==null){
      var s2=m2.index+m2[1].length,e2=s2+m2[2].length;
      cands.push({s:s2,e:e2,ty:PATS[p].ty,p:PATS[p].p});
      if(m2.index===re2.lastIndex)re2.lastIndex++;
    }
  }
  cands.sort(function(a,b){return a.p===b.p?a.s-b.s:a.p-b.p;});
  for(var c=0;c<cands.length;c++){
    var q=cands[c],t=raw.slice(q.s,q.e);
    if(q.ty==='lieu'){
      var mm=t.match(new RegExp('[A-ZÀ-Ö][’\'\\-'+L+']+(?:[ \\-][A-ZÀ-Ö][’\'\\-'+L+']+)?$'));
      if(!mm)continue;
      if(/^(?:à|au|aux|chez|vers|entre|jusqu|depuis)/i.test(t)){q.s=q.s+t.indexOf(mm[0]);t=mm[0];}
      if(STOP.test(t.split(/[ \-]/)[0]))continue;
    }
    if(collect)pushDet(t,q.ty);
    if(dis[q.ty])continue;
    if(REFUS.indexOf(norm(t))>-1)continue;
    if(auto>=CAPL[LEVEL])continue;
    if(claim(q.s,q.e,q.ty))auto++;
  }
  keep.sort(function(a,b){return a.s-b.s;});
  var out='',pos=0;
  for(var i=0;i<keep.length;i++){
    var k=keep[i],txt=esc(raw.slice(k.s,k.e));
    out+=esc(raw.slice(pos,k.s));
    if(k.k==='a')out+='<a href="'+esc(k.u)+'">'+txt+'</a>';
    else out+='<b>'+txt+'</b>';
    pos=k.e;
  }
  return {h:out+esc(raw.slice(pos)),n:keep.filter(function(x){return x.k!=='a';}).length,bw:bw};
}
function run(text,dis,collect){
  var src=text.split('\n'),out=[],sig=src.length,bw=0,nb=0;
  for(var i=0;i<src.length;i++)if(FIN.test(src[i])){sig=i;break;}
  for(var i=0;i<src.length;i++){
    /* garde-fou : une IA renvoie parfois *** ou une étoile orpheline —
       on normalise pour qu’aucune étoile ne se retrouve dans le mail. */
    var line0=src[i].replace(/\*{3,}/g,'**');
    if(((line0.match(/\*\*/g)||[]).length)%2)line0=line0.replace(/\*\*(?![\s\S]*\*\*)/,'');
    var pl=parseLine(line0),raw=pl.l,t=raw.trim(),marks=pl.m.slice();
    if(t===''){out.push({h:'',b:0,t:'',sig:i>=sig});continue;}
    if(i<sig&&STRUCT){
      var alpha=t.replace(new RegExp('[^'+L+']','g'),'');
      if(alpha.length>=4&&alpha===alpha.toUpperCase()&&t.length<=70){
        marks.push({s:0,e:raw.length,k:'b',ty:'structure'});
      }else{
        var lm=raw.match(new RegExp('^(\\s*(?:[-–—•*]\\s*)?)(['+L+'][^:\\n]{1,25})(\\u202F?):(\\s|$)'));
        if(lm&&!/\d$/.test(lm[2])){
          marks.push({s:0,e:lm[1].length+lm[2].length+lm[3].length+1,k:'b',ty:'structure'});
        }else{
          var pe=(i===0)||src[i-1].trim()==='';
          var nf=(i+1<src.length&&src[i+1].trim()!=='')||(i+2<src.length&&src[i+2].trim()!=='');
          if(pe&&nf&&t.length<=44&&t.split(/\s+/).length<=6&&!/[.,;:!?…]$/.test(t)&&/^[A-ZÀ-Ö]/.test(t))
            marks.push({s:0,e:raw.length,k:'b',ty:'structure'});
        }
      }
    }
    var r=inline(raw,marks,i>=sig?{all:1,dictionnaire:1,montant:1,date:1,horaire:1,délai:1,quantité:1,lieu:1,livrable:1,valeur:1,'échéance':1}:dis,collect&&i<sig);
    out.push({h:r.h,b:r.n,t:raw,sig:i>=sig});
    bw+=r.bw;nb+=r.n;
  }
  return {lines:out,bw:bw,nb:nb};
}
function analyse(text){
  DET=[];DROP=[];
  var dis={},r=run(text,dis,true);
  var w=(text.match(/\S+/g)||[]).length||1;
  var i=0;
  while(r.bw/w>CAPD[LEVEL]&&i<OFF_ORDER.length){
    if(catOn(OFF_ORDER[i])||OFF_ORDER[i]==='dictionnaire'){dis[OFF_ORDER[i]]=1;DROP.push(OFF_ORDER[i]);r=run(text,dis,false);}
    i++;
  }
  DENS=Math.round(r.bw/w*100);
  for(var j=0;j<DET.length;j++)if(DROP.indexOf(DET[j].ty)>-1)DET[j].drop=true;
  return r.lines;
}
var DENS=0;

/* ========== CONSTRUCTION DU MAIL ========== */
function blocks(lines){
  var out=[],cur=null;
  for(var i=0;i<lines.length;i++){
    var L=lines[i];
    if(L.t.trim()===''){cur=null;continue;}
    var bullet=/^\s*[-–—•*]\s+/.test(L.t);
    var kind=bullet?'ul':(L.sig?'sig':'p');
    if(!cur||cur.kind!==kind){cur={kind:kind,items:[]};out.push(cur);}
    cur.items.push(bullet?L.h.replace(/^\s*(<b>)?\s*[-–—•*]\s+/,'$1'):L.h);
  }
  return out;
}
function mailInner(lines,forCopy){
  var b=blocks(lines),h='';
  for(var i=0;i<b.length;i++){
    var k=b[i].kind,it=b[i].items;
    if(k==='ul'){
      h+=forCopy?'<ul style="margin:0 0 15px 0;padding-left:22px">':'<ul>';
      for(var j=0;j<it.length;j++)h+=(forCopy?'<li style="margin:0 0 6px 0">':'<li>')+it[j]+'</li>';
      h+='</ul>';
    }else{ /* signature comprise : même taille, même couleur que le reste du mail */
      h+=(forCopy?'<p style="margin:0 0 15px 0">':'<p>')+it.join('<br>')+'</p>';
    }
  }
  return h;
}
function mailForCopy(lines){
  var inner=mailInner(lines,true).replace(/<a href=/g,'<a style="color:#1a73e8;text-decoration:underline" href=');
  return '<div style="max-width:'+WIDTH+'px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6">'+inner+'</div>';
}
function plainText(text,cols){
  var src=text.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g,'$1 : $2').replace(/\*\*/g,'');
  var ps=src.split('\n'),out=[],blank=false;
  for(var i=0;i<ps.length;i++){
    var t=ps[i];
    if(t.trim()===''){if(!blank)out.push('');blank=true;continue;}
    blank=false;
    var bm=t.match(/^\s*([-–—•*])\s+(.*)$/),pre='',body=t.trim();
    if(bm){pre='- ';body=bm[2].trim();}
    var w=body.split(/\s+/),ls=[],c='';
    for(var j=0;j<w.length;j++){
      if(c==='')c=w[j];
      else if((c+' '+w[j]).length<=cols-pre.length)c+=' '+w[j];
      else{ls.push(c);c=w[j];}
    }
    if(c!=='')ls.push(c);
    for(var j=0;j<ls.length;j++)out.push((j===0?pre:(pre?'  ':''))+ls[j]);
  }
  return out.join('\n').replace(/ /g,' ').trim();
}

var SAVE;
function render(){
  var text=$('body').value,lines=analyse(text);
  var cols=Math.max(40,Math.round(WIDTH/7));
  var plain=plainText(text,cols);
  if(VIEW!=='bold')renderPreview(lines,plain.replace(/\n/g,' '));
  renderInsp();
  var nb=0;for(var i=0;i<lines.length;i++)nb+=lines[i].b;
  $('bcount').textContent=nb;
  var words=(text.match(/\S+/g)||[]).length;
  var longs=text.replace(/\n/g,' ').split(/[.!?…]+/).filter(function(s){return (s.match(/\S+/g)||[]).length>30;}).length;
  var s=$('subj').value.length,f=$('sfill');
  $('sn').textContent=s;f.style.width=Math.min(100,s/70*100)+'%';
  f.style.background=s===0?'var(--line2)':(s<=41?'var(--ok)':(s<=70?'var(--warn)':'var(--crit)'));
  $('status').innerHTML='<span><b>'+words+'</b> mots</span>'
    +'<span>texte brut à <b>'+cols+'</b> car.</span>'
    +'<span><b>'+nb+'</b> gras · <b>'+DENS+' %</b></span>'
    +'<span class="'+(longs?'warn':'ok')+'">'+(longs?longs+' phrase(s) de plus de 30 mots':'phrases de bonne longueur')+'</span>'
    +'<span class="'+(s>70?'crit':(s>41?'warn':'ok'))+'">objet '+(s===0?'vide':(s<=41?'entier sur iPhone':(s<=70?'coupé sur iPhone':'coupé partout')))+'</span>';
  clearTimeout(SAVE);SAVE=setTimeout(function(){STORE.set('draft',{s:$('subj').value,b:text});},600);
  return {lines:lines,plain:plain};
}

var IAPROMPT='Voici un e-mail professionnel en francais. Reperе les elements que le destinataire doit retenir en un coup d\u2019oeil : montants, dates, horaires, lieux, delais, livrables, engagements et conditions. Encadre chacun de ces passages avec ** **.\n\nRegles strictes :\n- ne reformule rien, n\u2019ajoute rien, ne supprime rien : renvoie exactement le meme texte, avec seulement les ** en plus\n- deux passages en gras au maximum par paragraphe\n- aucun gras apres la formule de politesse ni dans la signature\n- ne touche pas aux liens de la forme [texte](adresse)\n- les marqueurs entre crochets doubles comme ⟦NOM1⟧ remplacent des donnees masquees : recopie-les a l’identique, tu peux les mettre en gras\n- reponds uniquement avec le texte, sans commentaire ni bloc de code\n\nTexte :\n\n';
var GAPI='https://generativelanguage.googleapis.com/v1beta/';
function gErr(e){
  var m=(e&&e.message)||String(e);
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))
    return location.protocol==='file:'
      ? 'Appel refusé : ce fournisseur n’autorise pas les requêtes depuis un navigateur (CORS), ou tu es hors ligne.'
      : 'Les appels réseau sont bloqués sur la page publiée : ouvre le fichier local sur ton Mac.';
  return m;
}
function oURL(path){var b=AIBASE.replace(/\/+$/,'');if(!/\/v\d+$/.test(b))b+='/v1';return b+path;}
function oCall(msgs,maxTok){
  return fetch(oURL('/chat/completions'),{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+OKEY},
    body:JSON.stringify({model:AIMODEL,messages:msgs,temperature:0.1,max_tokens:maxTok||4096})
  }).then(function(r){return r.json();}).then(function(d){
    if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
    var c=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
    if(!c)throw new Error('Réponse vide du modèle');
    return String(c).replace(/^```[a-z]*\n?/i,'').replace(/```\s*$/,'').trim();
  });
}
function aiCall(txt){
  if(AIPROV==='gem')return gCall(txt);
  return oCall([{role:'system',content:IAPROMPT.replace(/\n\nTexte :\n\n$/,'')},{role:'user',content:txt}]);
}
/* teste si le navigateur a le droit d’appeler ce service — sans clé valable :
   si la réponse revient (même en erreur 401), la porte est ouverte. */
function probe(kind,base){
  var url,opt;
  if(kind==='oai'){
    var b=(base||AIBASE).replace(/\/+$/,'');if(!/\/v\d+$/.test(b))b+='/v1';
    url=b+'/chat/completions';
    opt={method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer probe'},
         body:'{"model":"probe","messages":[{"role":"user","content":"ping"}],"max_tokens":1}'};
  }else{
    url=GAPI+'models/gemini-2.5-flash:generateContent?key=probe';
    opt={method:'POST',headers:{'Content-Type':'application/json'},body:'{"contents":[]}'};
  }
  return fetch(url,opt).then(function(){return true;}).catch(function(){return false;});
}
function gModel(){
  if(GMODEL)return Promise.resolve(GMODEL);
  return fetch(GAPI+'models?key='+encodeURIComponent(GKEY)).then(function(r){return r.json();}).then(function(d){
    if(d.error)throw new Error(d.error.message);
    var ok=(d.models||[]).filter(function(m){return (m.supportedGenerationMethods||[]).indexOf('generateContent')>-1;})
      .map(function(m){return m.name.replace(/^models\//,'');});
    var pick=ok.filter(function(n){return /flash-lite/.test(n)&&!/preview|exp|thinking|image|tts/.test(n);})[0]
           ||ok.filter(function(n){return /flash/.test(n)&&!/preview|exp|thinking|image|tts/.test(n);})[0]
           ||ok[0];
    if(!pick)throw new Error('Aucun modèle disponible avec cette clé.');
    GMODEL=pick;STORE.set('gmodel',pick);return pick;
  });
}
function gCall(txt,prompt){
  var body=JSON.stringify({contents:[{role:'user',parts:[{text:(prompt||IAPROMPT)+txt}]}],
    generationConfig:{temperature:0.1,maxOutputTokens:4096}});
  return gModel().then(function(m){
    var url=GAPI+'models/'+m+':generateContent?key='+encodeURIComponent(GKEY);
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body})
      .catch(function(){ /* préflight CORS refusé : on retente en requête simple */
        return fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:body});
      });
  }).then(function(r){return r.json();}).then(function(d){
    if(d.error)throw new Error(d.error.message);
    var c=d.candidates&&d.candidates[0];
    var t=c&&c.content&&c.content.parts&&c.content.parts.map(function(x){return x.text||'';}).join('');
    if(!t)throw new Error('Réponse vide'+(c&&c.finishReason?' ('+c.finishReason+')':''));
    return t.replace(/^```[a-z]*\n?/i,'').replace(/```\s*$/,'').trim();
  });
}
/* ---------- anonymisation avant envoi ----------
   Remplace noms, coordonnées et montants par des marqueurs ⟦NOM1⟧ que le modèle
   recopie tels quels ; les vraies valeurs sont remises au retour, en local. */
function anonymize(t){
  var map=[],n=0,out=t;
  function tok(kind,val){
    for(var i=0;i<map.length;i++)if(map[i].v===val)return map[i].t;
    var s='⟦'+kind+(++n)+'⟧';map.push({t:s,v:val});return s;
  }
  out=out.replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,function(m){return tok('MAIL',m);});
  out=out.replace(/(?:\+33|0)[\s.\-]?[1-9](?:[\s.\-]?\d{2}){4}/g,function(m){return tok('TEL',m);});
  out=out.replace(/(?:\d{1,3}(?:[    ]\d{3})+|\d+)(?:[.,]\d{1,2})?\s?(?:€|EUR|euros?)/gi,function(m){return tok('MONTANT',m);});
  out=out.replace(/\b(Madame|Monsieur|Mme|Mlle|M\.)\s+([A-ZÀ-Ö][’'\-A-Za-zÀ-ÖØ-öø-ÿ]+)/g,function(m,a,b){return a+' '+tok('NOM',b);});
  out=out.replace(/\b(Bonjour|Bonsoir|Salut|Chère|Cher|Chers)\s+([A-ZÀ-Ö][’'\-A-Za-zÀ-ÖØ-öø-ÿ]+)/g,function(m,a,b){return a+' '+tok('NOM',b);});
  for(var d=0;d<DICO.length;d++){
    var v=DICO[d];if(!v||out.indexOf(v)<0)continue;
    out=out.split(v).join(tok('CLIENT',v));
  }
  return {t:out,map:map};
}
function deanon(t,map){
  var missing=0;
  for(var i=0;i<map.length;i++){
    if(t.indexOf(map[i].t)<0)missing++;
    t=t.split(map[i].t).join(map[i].v);
  }
  return {t:t,missing:missing};
}
function nu(t){return t.replace(/\*\*/g,'').replace(/\s+/g,' ').trim();}

function insert(t){
  var ta=$('body'),s=ta.selectionStart,e=ta.selectionEnd;ta.focus();
  if(ta.setRangeText)ta.setRangeText(t,s,e,'end');
  else{ta.value=ta.value.slice(0,s)+t+ta.value.slice(e);ta.selectionStart=ta.selectionEnd=s+t.length;}
  render();
}
function insertLien(i){
  var l=LIENS[i],ta=$('body'),s=ta.selectionStart,e=ta.selectionEnd;
  var label=(s!==e)?ta.value.slice(s,e):((l.e?l.e+' ':'')+l.t);
  insert('['+label+']('+l.u+')');
}
/* =========================================================
   STRUCTURATION EN PARAGRAPHES
   Reconstruit un mail collé en un bloc : rétablit les sauts de ligne perdus,
   isole les salutations, ouvre un paragraphe à chaque étiquette « Sujet : »
   ou connecteur de transition, et limite chaque paragraphe à deux phrases.
   ========================================================= */
var CONNECT=/^(par ailleurs|en outre|de plus|cependant|toutefois|néanmoins|en revanche|enfin|ainsi|c’est pourquoi|c'est pourquoi|concernant|s’agissant|suite à|compte tenu|en raison|à ce titre|par conséquent|en conséquence|de ce fait|dans ce cadre|pour rappel|pour information|à noter|autre point|dernier point|pour finir|au vu de|à la suite)/i;
var PRON=/^(j’|j'|je |nous |mon |ma |mes |notre |nos )/i;
var SALUT=/^(bonjour|bonsoir|salut|chère|cher|chers|madame|monsieur)\b/i;
var ABREV=/(?:^|[\s(])(M|MM|Mme|Mlle|Dr|Pr|art|cf|ex|tél|env|réf|p|no|n°|St|Ste|etc|av|bd|Me)\.$/i;

function sentences(line){
  var re=/[^.!?…]+[.!?…]*\s*/g,m,raw=[];
  while((m=re.exec(line))!==null){if(m[0].trim())raw.push(m[0].trim());}
  if(!raw.length)return [line.trim()];
  var out=[raw[0]];
  for(var i=1;i<raw.length;i++){
    var prev=out[out.length-1],nxt=raw[i];
    /* on recolle si la coupure vient d’une abréviation ou d’un fragment qui ne démarre pas une phrase */
    if(ABREV.test(prev)||!/^[A-ZÀ-Ö«"(]/.test(nxt))out[out.length-1]=prev+' '+nxt;
    else out.push(nxt);
  }
  return out;
}
function isLabel(s){return /^[A-ZÀ-Ö][^:\n]{1,44}\s?:/.test(s)&&!/^https?:/i.test(s);}

function structurer(txt){
  var links=[];
  var t=txt.replace(/\[[^\]\n]+\]\([^)\s]+\)/g,function(m){links.push(m);return '@@LIEN'+(links.length-1)+'@@';});
  t=t.replace(/\r\n?/g,'\n').replace(/[ \t]+/g,' ');
  t=t.replace(/([.!?…])([A-ZÀ-Ö«])/g,function(m,a,b,off,s){
    return ABREV.test(s.slice(Math.max(0,off-7),off+1))?m:a+'\n'+b;
  });
  var lines=t.split('\n'),sig=-1;
  for(var i=0;i<lines.length;i++)if(FIN.test(lines[i].trim())){sig=i;break;}
  var paras=[],cur=[],curLabel=false,curWords=0;
  function flush(){if(cur.length){paras.push(cur.join(' '));cur=[];curLabel=false;curWords=0;}}
  for(var i=0;i<lines.length;i++){
    var L=lines[i].trim();
    if(L===''){flush();continue;}
    if(sig>=0&&i>=sig){flush();paras.push('@@S@@'+L);continue;}
    if(/^[-–—•*]\s+/.test(L)){flush();paras.push('@@S@@'+L);continue;}
    if(SALUT.test(L)&&L.length<70){flush();paras.push(L);continue;}
    var ss=sentences(L);
    for(var j=0;j<ss.length;j++){
      var s=ss[j],lab=isLabel(s);
      if(lab||CONNECT.test(s)||(curLabel&&PRON.test(s))||curWords>=45||cur.length>=2)flush();
      cur.push(s);curLabel=curLabel||lab;curWords+=(s.match(/\S+/g)||[]).length;
      if(/:$/.test(s))flush();
    }
  }
  flush();
  var res='';
  for(var i=0;i<paras.length;i++){
    var simple=paras[i].indexOf('@@S@@')===0,prevSimple=i>0&&paras[i-1].indexOf('@@S@@')===0;
    res+=(i===0?'':(simple&&prevSimple?'\n':'\n\n'))+(simple?paras[i].slice(5):paras[i]);
  }
  return res.replace(/@@LIEN(\d+)@@/g,function(m,n){return links[+n];}).trim();
}
function doStruct(){
  var ta=$('body'),before=ta.value;
  if(!before.trim()){toast('Le mail est vide',1);return;}
  var out=structurer(before);
  if(out===before.trim()){toast('Le mail est déjà structuré');return;}
  LASTBODY=before;ta.value=out;render();
  toast(out.split(/\n{2,}/).length+' paragraphes',0,
    {l:'Annuler',f:function(){if(LASTBODY!==null){ta.value=LASTBODY;LASTBODY=null;render();}}});
}
function doClean(){
  var ta=$('body'),before=ta.value;
  ta.value=nettoyer(before);$('subj').value=nettoyer($('subj').value).replace(/\n/g,' ');
  render();toast(before===ta.value?'Rien à nettoyer':'Typographie française appliquée');
}
function gras(){
  var ta=$('body'),s=ta.selectionStart,e=ta.selectionEnd;
  if(s===e){toast('Sélectionne d’abord un passage',1);return;}
  var sel=ta.value.slice(s,e);
  ta.setRangeText(/^\*\*[\s\S]+\*\*$/.test(sel)?sel.slice(2,-2):'**'+sel+'**',s,e,'end');render();
}

/* ========== COPIE ========== */
function copyPlain(txt,msg){
  var ok=false;
  try{var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){}
  if(ok){toast(msg);return;}
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){toast(msg);},function(){toast('Copie refusée par le navigateur',1);});
  else toast('Copie refusée par le navigateur',1);
}
function copyRich(html,txt){
  var done=function(){toast('Mis en forme — colle dans Gmail avec ⌘V');};
  if(navigator.clipboard&&window.ClipboardItem){
    try{
      navigator.clipboard.write([new ClipboardItem({
        'text/html':new Blob([html],{type:'text/html'}),
        'text/plain':new Blob([txt],{type:'text/plain'})})]).then(done,function(){fallbackRich(html,done);});
      return;
    }catch(e){}
  }
  fallbackRich(html,done);
}
function fallbackRich(html,done){
  var el=$('clip'),ok=false;
  el.innerHTML=html;
  try{
    var r=document.createRange();r.selectNodeContents(el);
    var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
    ok=document.execCommand('copy');sel.removeAllRanges();
  }catch(e){}
  el.innerHTML='';
  if(ok)done();else toast('Copie refusée par le navigateur',1);
}
function pushHist(){
  var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
  HIST.unshift({d:p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+'h'+p(d.getMinutes()),s:$('subj').value,b:$('body').value});
  HIST=HIST.slice(0,20);STORE.set('hist',HIST);
}

/* =========================================================
   COLLAGE RICHE — conserve listes, gras et liens
   Un textarea ne reçoit que du texte brut : les puces d’un mail copié
   depuis Gmail ou un assistant disparaissent. On lit donc le HTML du
   presse-papiers et on le convertit nous-mêmes.
   ========================================================= */
function htmlToTexte(html){
  var doc=new DOMParser().parseFromString(html,'text/html');
  Array.prototype.forEach.call(doc.querySelectorAll('style,script,meta,title,head'),function(n){n.parentNode&&n.parentNode.removeChild(n);});
  var out='';
  function plain(n){return (n.textContent||'').replace(/ /g,' ').replace(/\s+/g,' ');}
  function walk(node,depth){
    var kids=node.childNodes;
    for(var i=0;i<kids.length;i++){
      var c=kids[i];
      if(c.nodeType===3){out+=(c.nodeValue||'').replace(/ /g,' ').replace(/[ \t\r\n]+/g,' ');continue;}
      if(c.nodeType!==1)continue;
      var tag=c.tagName.toLowerCase();
      if(tag==='br'){out+='\n';continue;}
      if(tag==='ul'||tag==='ol'){
        out=out.replace(/[ \t]+$/,'');
        if(!/\n$/.test(out))out+='\n';
        var num=1;
        for(var j=0;j<c.children.length;j++){
          var li=c.children[j];
          if(li.tagName.toLowerCase()!=='li')continue;
          out+=new Array(depth+1).join('  ')+(tag==='ol'?(num++)+'. ':'– ');
          walk(li,depth+1);
          out=out.replace(/[ \t]+$/,'');
          if(!/\n$/.test(out))out+='\n';
        }
        out+='\n';continue;
      }
      if(tag==='li'){walk(c,depth);continue;}
      if(tag==='b'||tag==='strong'){var s=plain(c).trim();if(s)out+='**'+s+'**';continue;}
      if(tag==='a'){
        var href=c.getAttribute('href')||'',lab=plain(c).trim();
        out+=(lab&&/^https?:/i.test(href)&&href!==lab)?('['+lab+']('+href+')'):lab;
        continue;
      }
      if(/^(p|h[1-6]|blockquote)$/.test(tag)){
        walk(c,depth);out=out.replace(/[ \t]+$/,'');
        if(!/\n\n$/.test(out))out+=/\n$/.test(out)?'\n':'\n\n';
        continue;
      }
      if(/^(div|tr|section|article|header|footer)$/.test(tag)){
        walk(c,depth);out=out.replace(/[ \t]+$/,'');
        if(!/\n$/.test(out))out+='\n';
        continue;
      }
      walk(c,depth);
    }
  }
  walk(doc.body||doc,0);
  return out.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
$('body').addEventListener('paste',function(e){
  var cd=e.clipboardData;
  if(cd){
    var html=cd.getData('text/html');
    if(html&&/<(ul|ol|li|p|b|strong|a|br)\b/i.test(html)){
      var t=nettoyer(htmlToTexte(html));
      if(t){
        e.preventDefault();
        insert(t);
        var puces=(t.match(/^\s*[–\d]/gm)||[]).length;
        toast('Collé en gardant la mise en forme'+(puces?' · '+puces+' lignes de liste':''));
        return;
      }
    }
  }
  setTimeout(function(){
  var ta=$('body'),p=ta.selectionStart,v=ta.value,n=nettoyer(v);
  if(n!==v){ta.value=n;ta.selectionStart=ta.selectionEnd=Math.min(p,n.length);toast('Collé et nettoyé');}
  render();},10);});
