<!-- ═══════════════════════════════════════════════════════════════════
     CORRECTIF 2026-08-23-A — retournement iOS, cadrage d'image, barre
     haute mobile, fluidité, icône Mac.  Supprime ce bloc pour l'annuler.
     ═══════════════════════════════════════════════════════════════════ -->
<style>
/* 1 — Safari iOS n'applique pas backface-visibility quand la face porte
   overflow + backdrop-filter : le recto restait visible, à l'envers.
   On bascule l'opacité à mi-rotation, quand la carte est vue par la tranche. */
.face{transition:opacity 0s linear .32s}
.card:not(.flipped) .back{opacity:0;pointer-events:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.card.flipped .front{opacity:0;pointer-events:none}

/* 2 — cadrage « Adapté » : l'image entière, posée sur un fond flou tiré d'elle-même */
.imgbg{position:absolute;inset:-14%;z-index:0;background-size:cover;background-position:center;
  filter:blur(28px) saturate(1.3) brightness(.6);opacity:.9;pointer-events:none}
.card.adapt .front::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.04) 0%,rgba(0,0,0,.32) 68%,rgba(0,0,0,.8) 100%)}
.card.adapt .glow{display:none}
.card.adapt .vis{padding:6px 0 2px}
.card.adapt .vis img{max-height:100%;max-width:90%;height:auto;width:auto;object-fit:contain;
  filter:drop-shadow(0 16px 28px rgba(0,0,0,.6))}

/* 3 — barre haute : encoche respectée, actions défilantes, menu jamais coupé */
@supports (padding:env(safe-area-inset-top)){ .top{padding-top:calc(12px + env(safe-area-inset-top))} }
@media (max-width:640px){
  .top{flex-direction:column;align-items:stretch;gap:8px;
       padding:calc(9px + env(safe-area-inset-top)) 12px 9px}
  .brand{display:none}
  .tabs{width:100%}
  .tab{flex:1;padding:9px 6px;font-size:12.5px;text-align:center}
  .acts{width:100%;display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;overflow-y:visible;
        -webkit-overflow-scrolling:touch;scrollbar-width:none;padding:1px 0;justify-content:flex-start}
  .acts::-webkit-scrollbar{display:none}
  .btn{flex:0 0 auto}
  .menu{position:fixed;left:auto;right:14px;top:auto;bottom:calc(88px + env(safe-area-inset-bottom));
        min-width:220px;max-height:58vh;overflow-y:auto}
}

/* 4 — fluidité : moins de flou à composer sur petit écran */
@media (max-width:900px){
  .back{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .back::after{filter:blur(14px)}
  .glow{filter:blur(18px)}
}
</style>

<script>
(function(){
  /* A — écriture réseau regroupée : plus une requête Supabase par frappe */
  var remoteSave = save, netT = null;
  save = function(record){
    if (record !== false) { try { recordUndo(); } catch(e){} }
    try { saveLocal(); } catch(e){}
    clearTimeout(netT);
    netT = setTimeout(function(){ remoteSave(false); }, 600);
  };

  /* B — panneau Détails : on ne redessine plus la grille à chaque caractère */
  var applyNow = applySheet, uiT = null;
  applySheet = function(){ clearTimeout(uiT); uiT = setTimeout(applyNow, 130); };

  /* C — troisième cadrage d'image */
  var drawDevice = FRONT.device;
  FRONT.device = function(f, n){
    if (n.img && n.imgFit === 'adapt') {
      var bg = document.createElement('div');
      bg.className = 'imgbg';
      bg.style.backgroundImage = 'url("' + n.img + '")';
      f.appendChild(bg);
    }
    drawDevice(f, n);
  };

  var buildOne = buildCard;
  buildCard = function(slot, i){
    var c = buildOne(slot, i);
    if (slot.n.img && slot.n.imgFit === 'adapt' && slot.n.kind === 'device') c.classList.add('adapt');
    return c;
  };

  /* le bouton Cadrage enchaîne : petit → moyen → grand → adapté → couverture */
  var CYCLE = [['contain',70],['contain',100],['contain',135],['adapt',100],['cover',100]];
  grid.addEventListener('click', function(e){
    var btn = e.target.closest('[data-act="fit"]'); if (!btn) return;
    var card = btn.closest('.card'); if (!card) return;
    var n = dataset.find(function(x){ return x.id === card.dataset.id; }); if (!n) return;
    e.stopPropagation();
    var cur = -1;
    for (var k = 0; k < CYCLE.length; k++) {
      if (CYCLE[k][0] === n.imgFit && (n.imgFit !== 'contain' || CYCLE[k][1] === (Number(n.imgScale) || 100))) { cur = k; break; }
    }
    var nx = CYCLE[(cur + 1) % CYCLE.length];
    n.imgFit = nx[0]; n.imgScale = nx[1];
    save(); render();
  }, true);

  /* la même option dans le panneau Détails */
  var sel = document.getElementById('fFit');
  if (sel && !sel.querySelector('option[value="adapt"]')) {
    var o = document.createElement('option');
    o.value = 'adapt'; o.textContent = 'Adapté — image entière, fond flou';
    sel.insertBefore(o, sel.querySelector('option[value="cover"]'));
  }

  /* D — icône Mac : macOS choisit la plus grande taille disponible.
     Dépose icon-512.png à côté de index.html pour supprimer le cadre blanc. */
  if (!document.querySelector('link[rel="apple-touch-icon"][sizes="512x512"]')) {
    var l = document.createElement('link');
    l.rel = 'apple-touch-icon'; l.setAttribute('sizes','512x512'); l.href = 'icon-512.png';
    document.head.appendChild(l);
  }
})();
</script>
