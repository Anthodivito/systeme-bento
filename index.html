grid.addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const n = dataset.find(x => x.id === card.dataset.id); if (!n) return;
  const btn = e.target.closest('[data-act]');
  const act = btn ? btn.dataset.act : null;

  if (act === 'flip') { card.classList.toggle('flipped'); return; }

  if (act === 'bul-toggle') {                       /* cocher : hors mode Modifier aussi */
    const it = btn.closest('.bul-i'), i = parseInt(it.dataset.bi, 10);
    const p = n.checkedBullets.indexOf(i);
    if (p > -1) n.checkedBullets.splice(p, 1); else n.checkedBullets.push(i);
    it.classList.toggle('done'); save(); return;
  }

  /* une ligne de liste s'ouvre au clic, en consultation comme en modification */
  const lrow = e.target.closest('.ls-r');
  if (lrow && !btn && !e.target.closest('[contenteditable]')) {
    const it = (n.items || [])[parseInt(lrow.dataset.li, 10)];
    if (it && it.url) { window.open(it.url, '_blank', 'noopener'); return; }
    if (!editing) return;
  }

  if (!editing) {
    if (card.dataset.kind === 'link') { if (n.url) window.open(n.url, '_blank', 'noopener'); return; }
    if (card.dataset.kind === 'device' && !e.target.closest('.face.back')) card.classList.toggle('flipped');
    return;
  }

  if (!act && !e.target.closest('[contenteditable]')) {      /* sélectionner la carte */
    const was = card.classList.contains('sel');
    grid.querySelectorAll('.card.sel').forEach(c => c.classList.remove('sel'));
    if (!was) card.classList.add('sel');
    return;
  }

  if (act === 'prev') shift(n.id, -1);
  else if (act === 'next') shift(n.id, 1);
  else if (act === 'status') { n.status = n.status === 'own' ? 'want' : 'own'; save(); render(); }
  else if (act === 'del') {
    if (board === 'none') { if (confirm('Supprimer définitivement « ' + (n.title || '') + ' » ?')) { dataset = dataset.filter(x => x.id !== n.id); save(); render(); } }
    else if (confirm('Retirer « ' + (n.title || '') + ' » ? Elle part dans « À trier ».')) { n.board = 'none'; save(); render(); }
  }
  else if (act === 'wider') { n.span = n.span >= 6 ? 2 : n.span + 1; save(); render(); }
  else if (act === 'tall')  { n.tall = !n.tall; save(); render(); }
  else if (act === 'glyph') { n.glyph = GLYPHS[(GLYPHS.indexOf(n.glyph) + 1) % GLYPHS.length]; n.img = ''; save(); render(); }
  else if (act === 'img')   { pickerFor = n.id; picker.click(); }
  else if (act === 'sheet') { openSheet(n); }
  else if (act === 'fit') {
    const CY = [['contain',70],['contain',100],['contain',135],['adapt',100],['cover',100]];
    let cur = -1;
    for (let k = 0; k < CY.length; k++)
      if (CY[k][0] === n.imgFit && (n.imgFit !== 'contain' || CY[k][1] === (Number(n.imgScale) || 100))) { cur = k; break; }
    const nx = CY[(cur + 1) % CY.length];
    n.imgFit = nx[0]; n.imgScale = nx[1];
    save(); render();
  }
  else if (act === 'bul-add') {
    n.bullets.push('Une étape'); save(); render();
    const last = grid.querySelector('.card[data-id="' + n.id + '"] .bul-i:last-child .bul-t');
    if (last) last.focus();
  }
  else if (act === 'bul-del') {
    const i = parseInt(btn.closest('.bul-i').dataset.bi, 10);
    n.bullets.splice(i, 1);
    n.checkedBullets = n.checkedBullets.filter(x => x !== i).map(x => x > i ? x - 1 : x);
    save(); render();
  }
  else if (act === 'ls-add') {
    n.items = n.items || [];
    const COL = ['var(--objectifs)','var(--moteur)','var(--gold)','var(--source)','var(--cockpit)','#FF4A82'];
    n.items.push({ label:'Nouvelle ligne', sub:'', url:'', glyph:'#d-spark',
                   color: COL[n.items.length % COL.length] });
    save(); render();
    const last = grid.querySelector('.card[data-id="' + n.id + '"] .ls-r:last-of-type [data-lsl]');
    if (last) { last.focus(); document.getSelection().selectAllChildren(last); }
  }
  else if (act === 'ls-del') {
    const i = parseInt(btn.closest('.ls-r').dataset.li, 10);
    n.items.splice(i, 1); save(); render();
  }
  else if (act === 'ls-glyph') {
    const i = parseInt(btn.closest('.ls-r').dataset.li, 10), it = n.items[i];
    it.glyph = GLYPHS[(GLYPHS.indexOf(it.glyph) + 1) % GLYPHS.length];
    save(); render();
  }
  else if (act === 'ai') { ouvrirAssistant(n, false); }
  else if (act === 'tag-add') { n.tags.push({ text:'Nouveau tag', color: n.color || 'var(--gold)' }); save(); render(); }

  /* --- sous-éléments : tuiles, rangée, pastilles --- */
  else if (act === 'grad') {
    const keys = Object.keys(GRADS);
    n.grad = keys[(keys.indexOf(n.grad) + 1) % keys.length];
    save(); render();
  }
  else if (act === 'skin') { n.skin = SKINS[(SKINS.indexOf(n.skin || 'plat') + 1) % SKINS.length]; save(); render(); }
  else if (act === 'budstyle') {
    const st = ['sobre','verre','couleur'];
    n.budStyle = st[(st.indexOf(n.budStyle) + 1) % st.length];
    save(); render();
  }
  else if (act === 'chip-add') {
    n.chips = n.chips || [];
    const TINTS = ['radial-gradient(120% 130% at 30% 0%,#1B4E7A,#0C2438 60%,#08131E)',
                   'radial-gradient(120% 130% at 30% 0%,#5B2A8A,#2A1240 60%,#150920)',
                   'radial-gradient(120% 130% at 30% 0%,#8A3B12,#3A1A0B 60%,#1B0C06)',
                   'radial-gradient(120% 130% at 30% 0%,#0F5138,#0A2A1E 60%,#07160F)',
                   'radial-gradient(120% 130% at 30% 0%,#7A1436,#3A0A1B 60%,#1B060D)',
                   'radial-gradient(120% 130% at 30% 0%,#2C3A52,#151C28 60%,#0B0E14)'];
    n.chips.push({ label:'Nouveau', glyph:'#d-spark', tint: TINTS[n.chips.length % TINTS.length] });
    save(); render();
  }
  else if (act === 'chip-del')   { n.chips.splice(+btn.closest('.chip').dataset.ci, 1); save(); render(); }
  else if (act === 'chip-glyph') {
    const i = +btn.closest('.chip').dataset.ci;
    n.chips[i].glyph = GLYPHS[(GLYPHS.indexOf(n.chips[i].glyph) + 1) % GLYPHS.length];
    save(); render();
  }
  else if (act === 'port-add') { n.ports = n.ports || []; n.ports.push('Élément'); save(); render(); }
  else if (act === 'port-del') { n.ports.splice(+btn.closest('.port').dataset.pi, 1); save(); render(); }
  else if (act === 'sw-add')   { n.swatches = n.swatches || []; n.swatches.push(FINISHES[n.swatches.length % FINISHES.length][1]); save(); render(); }
  else if (act === 'sw-del')   { n.swatches.splice(+btn.closest('.sw-w').dataset.si, 1); save(); render(); }
  else if (act === 'sw-cycle') {
    const i = +btn.closest('.sw-w').dataset.si;
    const cur = FINISHES.findIndex(f => f[1] === n.swatches[i]);
    n.swatches[i] = FINISHES[(cur + 1) % FINISHES.length][1];
    save(); render();
  }
});

let rendering = false;
grid.addEventListener('blur', e => {
  const t = e.target; if (!t.dataset) return;
  if (rendering || !t.isConnected) return;   /* le rendu détache l'élément : ne pas rejouer */
  /* prix saisi depuis la carte budget : il appartient à une AUTRE carte */
  if (t.dataset.devprice) {
    const d = dataset.find(x => x.id === t.dataset.devprice);
    if (d) { const np = parseEuro(t.textContent); if (d.price !== np) { d.price = np; save(); } }
    render(); return;
  }
  const card = t.closest('.card'); if (!card) return;
  const n = dataset.find(x => x.id === card.dataset.id); if (!n) return;
  const v = (t.textContent || '').trim();

  if (t.dataset.bullet !== undefined) {
    const i = +t.dataset.bullet;
    if (!v) {                                   /* étape vidée : la bulle disparaît */
      n.bullets.splice(i, 1);
      n.checkedBullets = n.checkedBullets.filter(x => x !== i).map(x => x > i ? x - 1 : x);
      save(); render(); return;
    }
    if (n.bullets[i] !== v) { n.bullets[i] = v; save(); }
    return;
  }
  if (t.dataset.lsl !== undefined) {
    const i = +t.dataset.lsl;
    if (!n.items[i]) return;
    if (!v) { n.items.splice(i, 1); save(); render(); return; }   /* ligne vidée : elle disparaît */
    if (n.items[i].label !== v) { n.items[i].label = v; save(); }
    return;
  }
  if (t.dataset.lss !== undefined) {
    const i = +t.dataset.lss;
    if (n.items[i] && n.items[i].sub !== v) { n.items[i].sub = v; save(); }
    return;
  }
  if (t.dataset.chip !== undefined) { const i = +t.dataset.chip; if (n.chips[i] && n.chips[i].label !== v) { n.chips[i].label = v; save(); } return; }
  if (t.dataset.port !== undefined) { const i = +t.dataset.port; if (n.ports[i] !== v) { n.ports[i] = v; save(); } return; }
  if (t.dataset.tag !== undefined) {
    const i = +t.dataset.tag;
    if (!v) { n.tags.splice(i, 1); save(); render(); return; }
    if (n.tags[i] && n.tags[i].text !== v) { n.tags[i].text = v; save(); }
    return;
  }
  const f = t.dataset.field; if (!f) return;
  if (f === 'price') { const p = parseEuro(v); if (n.price !== p) { n.price = p; save(); } render(); return; }
  if (n[f] !== v) { n[f] = v; save(); if (f === 'title') render(); }
}, true);

  const n = dataset.find(x => x.id === pickerFor); if (!n) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max = 640, s = Math.min(1, max / Math.max(im.width, im.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      n.img = cv.toDataURL('image/png');
      save(); render();
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
  this.value = '';
});

/* ajout d'une carte */
/* ---------------------------------------------------------------------------
   Changer le type d'une carte ne doit rien perdre : on ajoute ce que le nouveau
   type réclame, on ne touche pas au reste. Repasser au type d'origine restitue
   donc tout ce qui y était.
   --------------------------------------------------------------------------- */
const TINTS_CHIP = ['radial-gradient(120% 130% at 30% 0%,#1B4E7A,#0C2438 60%,#08131E)',
                    'radial-gradient(120% 130% at 30% 0%,#5B2A8A,#2A1240 60%,#150920)',
                    'radial-gradient(120% 130% at 30% 0%,#8A3B12,#3A1A0B 60%,#1B0C06)'];
const KIND_NEEDS = {
  chips (n){ if (!Array.isArray(n.chips) || !n.chips.length)
               n.chips = ['Un','Deux','Trois'].map((l,i)=>({label:l, glyph:'#d-spark', tint:TINTS_CHIP[i]})); },
  ports (n){ if (!Array.isArray(n.ports) || !n.ports.length) n.ports = ['Un','Deux','Trois','Quatre']; },
  finish(n){ if (!Array.isArray(n.swatches) || !n.swatches.length)
               n.swatches = ['linear-gradient(145deg,#F2F2F4,#B9BAC0 55%,#8E8F96)','linear-gradient(145deg,#3A3B40,#151619)'];
             if (!n.eyebrow) n.eyebrow = 'Finition'; },
  liste (n){ if (!Array.isArray(n.items) || !n.items.length)
               n.items = [{label:'Première ligne', sub:'', url:'', glyph:'#d-spark', color:'var(--cockpit)'}]; },
  stat  (n){ if (!n.unit) n.unit = 'unités'; if (!(n.title||'').trim()) n.title = '0'; },
  word  (n){ if (!(n.title||'').trim()) n.title = 'MOT'; },
  os    (n){ if (!(n.title||'').trim()) n.title = 'Bandeau'; },
  note  (n){ if (!(n.notes||'').trim()) n.notes = 'Écris ici.'; }
};
function ensureKind(n){
  const f = KIND_NEEDS[n.kind];
  if (f) { try { f(n); } catch(e){ console.warn('Conversion incomplète', e); } }
  return n;
}

  let src;
  if (b.dataset.tpl) {
    src = TEMPLATES[b.dataset.tpl];
    if (!src) return;
    src = JSON.parse(JSON.stringify(src));          /* copie : le modèle reste intact */
  } else {

    src = Object.assign({ kind: k }, BLANK[k]);

/* ---------------------------------------------------------------------------
   Déplacement des cartes : un seul mécanisme pour la souris et le doigt.
   Appui maintenu ≈ 320 ms → la carte se soulève et suit le curseur.
   Le glisser HTML5 ne fonctionne pas au doigt ; les événements pointeur, si.
   --------------------------------------------------------------------------- */
let grabbed = null, grabTimer = null, grabTarget = null, grabDX = 0, grabDY = 0, scrollLock = null;

function endGrab(commit){
  clearTimeout(grabTimer); grabTimer = null;
  if (!grabbed) return;
  const from = grabbed.dataset.id;
  const to   = grabTarget ? grabTarget.dataset.id : null;
  grabbed.classList.remove('grabbed');
  grabbed.style.transform = '';
  if (grabTarget) grabTarget.classList.remove('target');
  document.body.classList.remove('dragging-card');
  grabbed = null; grabTarget = null;
  if (bordTimer) { cancelAnimationFrame(bordTimer); bordTimer = null; }
  scrollLock = null;
  if (commit && to && to !== from) placeBefore(from, to);
}

grid.addEventListener('pointerdown', e => {
  if (!editing || e.button > 0 || searching()) return;
  const card = e.target.closest('.card'); if (!card) return;
  if (e.target.closest('[data-act],button,input,select,textarea')) return;
  /* Un appui long sur un libellé doit soulever la carte : sinon, sur les cartes
     dont presque toute la surface est du texte modifiable, le déplacement semble
     ne pas marcher. Un appui bref continue de poser le curseur, et si le champ
     est déjà en cours d'édition on le laisse tranquille pour sélectionner. */
  const edt = e.target.closest('[contenteditable]');
  if (edt && document.activeElement === edt) return;
  const sx = e.clientX, sy = e.clientY;
  pressX = sx; pressY = sy;
  grabTimer = setTimeout(() => {
    grabbed = card; grabDX = sx; grabDY = sy;
    card.classList.add('grabbed');
    document.body.classList.add('dragging-card');
    try { card.setPointerCapture(e.pointerId); } catch(_){}
    if (navigator.vibrate) navigator.vibrate([6, 20, 10]);
  }, 300);
});

let bordTimer = null;
function defilementBord(y){
  const H = window.innerHeight, marge = 110;
  let d = 0;
  if (y < marge) d = -Math.ceil((marge - y) / 6);
  else if (y > H - marge - 60) d = Math.ceil((y - (H - marge - 60)) / 6);
  if (!d) { if (bordTimer) { cancelAnimationFrame(bordTimer); bordTimer = null; } return; }
  if (bordTimer) return;
  const pas = () => {
    if (!grabbed) { bordTimer = null; return; }
    window.scrollBy(0, d);
    bordTimer = requestAnimationFrame(pas);
  };
  bordTimer = requestAnimationFrame(pas);
}

function moveGrab(x, y){
  if (!grabbed) return;
  defilementBord(y);
  grabbed.style.transform = 'translate(' + (x - grabDX) + 'px,' + (y - grabDY) + 'px)';
  grabbed.style.pointerEvents = 'none';
  const under = document.elementFromPoint(x, y);
  grabbed.style.pointerEvents = '';
  const t = under && under.closest ? under.closest('.card') : null;
  if (t === grabTarget) return;
  if (grabTarget) grabTarget.classList.remove('target');
  grabTarget = (t && t !== grabbed) ? t : null;
  if (grabTarget) grabTarget.classList.add('target');
}

grid.addEventListener('pointermove', e => {
  if (!grabbed) {
    if (grabTimer && (Math.abs(e.clientX - pressX) > 10 || Math.abs(e.clientY - pressY) > 10)) {
      clearTimeout(grabTimer); grabTimer = null;
    }
    return;
  }
  moveGrab(e.clientX, e.clientY);
});
grid.addEventListener('pointerup',     () => endGrab(true));
grid.addEventListener('pointercancel', () => endGrab(false));
grid.addEventListener('pointerleave',  e => { if (!grabbed) { clearTimeout(grabTimer); grabTimer = null; } });
/* pendant le déplacement au doigt, la page ne doit pas défiler */
grid.addEventListener('touchmove', e => { if (grabbed) e.preventDefault(); }, { passive:false });
/* un simple défilement annule l'appui maintenu */
grid.addEventListener('touchmove', () => { if (!grabbed) { clearTimeout(grabTimer); grabTimer = null; } }, { passive:true });

/* dépôt d'une image depuis le bureau (souris uniquement) */
['dragover','dragleave','drop'].forEach(t => {
  grid.addEventListener(t, e => {
    if (!editing) return;
    const c = e.target.closest('.card'); if (!c) return;
    const isFile = e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') > -1;
    if (!isFile) return;
    e.preventDefault();
    if (t === 'dragover') c.classList.add('drop'); else c.classList.remove('drop');
    if (t === 'drop' && e.dataTransfer.files.length && c.dataset.kind === 'device') {
      pickerFor = c.dataset.id;
      const dt = new DataTransfer(); dt.items.add(e.dataTransfer.files[0]);
      picker.files = dt.files; picker.dispatchEvent(new Event('change'));
    }
  });
});

  V('fTall').checked = !!n.tall;

  V('fBlock').checked = !!n.showBlock;
  V('fBlockL').value = n.blockLabel || '';
  V('fBlockV').value = n.blockVal || '';
  V('fTags').value = (n.tags || []).map(t => t && t.text).filter(Boolean).join(', ');
  renderItems(n);
  syncSheet();

  V('sheetTtl').textContent  = (n.title || '').trim() || 'Sans titre';

  sheetScrollY = window.scrollY;

    if (!isPhone()) setTimeout(() => c.scrollIntoView({ behavior:'smooth', block:'center' }), 60);
  }

const aiBox = document.getElementById('ai');

function aiUrl(){ return String(metaNode().aiUrl || '').trim(); }

function aiMsg(t, err){
  const m = document.getElementById('aiMsg');

}

function ouvrirAssistant(n, reglagesSeuls){
  aiNode = n; aiProps = [];
  const sansUrl = !aiUrl();
  document.getElementById('aiTtl').textContent = n ? ((n.title || '').trim() || 'Sans titre') : 'Réglages';
  document.getElementById('aiCfg').hidden = !(sansUrl || reglagesSeuls);

  aiMsg(reglagesSeuls
      ? 'Colle ici l’adresse de ta fonction Supabase. Elle est enregistrée avec tes données.'
      : (sansUrl ? 'L’assistant n’est pas encore branché : renseigne l’adresse de ta fonction ci-dessus.' : ''));
  aiBox.classList.add('open');
  setTimeout(() => {
    const c = document.getElementById('aiCfg');
    (c.hidden ? document.getElementById('aiPrecision') : document.getElementById('aiUrl')).focus();
  }, 80);

function fermerAssistant(){
  aiBox.classList.remove('open');
  aiNode = null; aiProps = [];
}

aiBox.addEventListener('click', e => { if (e.target === aiBox) fermerAssistant(); });

  c.hidden = !c.hidden;

});

  const v = this.value.trim();
  metaNode().aiUrl = v;
  save();
  aiMsg(v ? 'Adresse enregistrée.' : 'Adresse effacée : l’assistant est de nouveau endormi.');
});

document.getElementById('aiGo').addEventListener('click', async function(){
  if (!aiNode) return;
  const url = aiUrl();
  if (!url) {
    document.getElementById('aiCfg').hidden = false;
    document.getElementById('aiUrl').focus();
    aiMsg('Il manque l’adresse de la fonction.', true);
    return;
  }
  this.disabled = true; this.textContent = 'Un instant…';
  aiMsg('');
  document.getElementById('aiOut').innerHTML = '';
  document.getElementById('aiAdd').hidden = true;

  const ctl = new AbortController();
  const chrono = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      signal: ctl.signal,
      body: JSON.stringify({
        titre: aiNode.title || '',
        sousTitre: aiNode.sub || '',
        notes: aiNode.notes || '',
        etapes: aiNode.bullets || [],
        precision: document.getElementById('aiPrecision').value || ''
      })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.erreur || ('Erreur ' + r.status));
    aiProps = (d.etapes || []).filter(Boolean);
    if (!aiProps.length) throw new Error('Aucune étape proposée');
    afficherPropositions();
    aiMsg('Décoche ce que tu ne veux pas garder.');
  } catch (e) {
    let m = String(e.message || e);
    if (e.name === 'AbortError') m = 'Pas de réponse au bout de 25 secondes.';
    else if (/failed to fetch|networkerror|load failed/i.test(m))
      m = 'Fonction injoignable. Vérifie l’adresse, et que le domaine du site figure bien dans la liste ORIGINES de la fonction.';
    aiMsg(m, true);
  } finally {
    clearTimeout(chrono);
    this.disabled = false; this.textContent = aiProps.length ? 'Proposer autre chose' : 'Demander trois étapes';
  }
});

function afficherPropositions(){
  const box = document.getElementById('aiOut');
  box.innerHTML = '';
  aiProps.forEach((t, i) => {
    const l = document.createElement('label'); l.className = 'ai-i';
    const c = document.createElement('input'); c.type = 'checkbox'; c.checked = true; c.dataset.i = i;
    const sp = el('span', null, t);
    l.appendChild(c); l.appendChild(sp); box.appendChild(l);
  });
  document.getElementById('aiAdd').hidden = false;
}

document.getElementById('aiAdd').addEventListener('click', () => {
  if (!aiNode) return;
  const gardees = Array.prototype.slice.call(document.querySelectorAll('#aiOut input:checked'))
    .map(c => aiProps[+c.dataset.i]).filter(Boolean);
  if (!gardees.length) { aiMsg('Aucune étape retenue.', true); return; }
  const n = dataset.find(x => x.id === aiNode.id);
  if (!n) { fermerAssistant(); return; }
  if (!Array.isArray(n.bullets)) n.bullets = [];
  gardees.forEach(t => n.bullets.push(t));
  save(); render();
  fermerAssistant();
});

});

      if (mode) e2.inputMode = mode;

    };

    d.appendChild(mk('it-u', it.url, 'https://…', 'url'));

/* glisser la poignée vers le bas referme la feuille, comme dans iOS */
(function(){
  const grip = document.getElementById('sheetGrip');
  const head = sheet.querySelector('.sheet-head');
  let y0 = null, dy = 0;
  function start(e){
    if (!sheet.classList.contains('open') || !isPhone()) return;
    /* jamais depuis un bouton : sinon la capture du pointeur détourne le clic de la croix */
    if (e.target.closest('button,input,select,textarea,a')) return;
    y0 = e.clientY; dy = 0;
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', end);
    document.addEventListener('pointercancel', end);
  }
  function move(e){
    if (y0 === null) return;
    const d = e.clientY - y0;
    if (!sheet.classList.contains('dragging')) {
      if (d < 6) return;                       /* on n'entre en glissé qu'après un vrai mouvement */
      sheet.classList.add('dragging');
    }
    dy = Math.max(0, d);
    sheet.style.transform = 'translateY(' + dy + 'px)';
    e.preventDefault();
  }
  function end(){
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', end);
    document.removeEventListener('pointercancel', end);
    if (y0 === null) return;
    sheet.classList.remove('dragging');
    sheet.style.transform = '';
    const far = dy > 110;
    y0 = null; dy = 0;
    if (far) closeSheet();
  }
  [grip, head].forEach(el => { if (el) el.addEventListener('pointerdown', start); });
})();

});

  n.kind = V('fKind').value || n.kind;
  if (n.kind !== kindAvant) ensureKind(n);       /* on remplit ce qui manque au nouveau type */
  n.span = parseInt(V('fSpan').value, 10) || n.span || 3;
  n.tall = V('fTall').checked;
  n.imgFit = V('fFit').value || 'contain';
  n.imgScale = parseInt(V('fScale').value, 10) || 100;
  n.glyph = V('fGlyph').value || n.glyph;
  const u = V('fImg').value.trim();
  if (u) n.img = u; else if (n.img && n.img.indexOf('data:') !== 0) n.img = '';
  n.price = parseEuro(V('fPrice').value);
  n.grad = V('fGrad').value || n.grad;
  n.budStyle = V('fBudStyle').value || n.budStyle;
  n.skin = V('fSkin').value || n.skin || 'plat';
  n.url = V('fUrl').value.trim();
  n.color = V('fColor').value || n.color;
  if (n.kind === 'liste') readItems(n);
  n.showBlock = V('fBlock').checked;
  n.blockLabel = V('fBlockL').value; n.blockVal = V('fBlockV').value;
  /* on conserve la couleur d'un tag qui existait déjà, on en attribue une aux nouveaux */
  const ancTags = {};
  (n.tags || []).forEach(t => { if (t && t.text) ancTags[sansAccent(t.text)] = t.color; });
  n.tags = V('fTags').value.split(',').map(x => x.trim()).filter(Boolean).map(txt => ({
    text: txt, color: ancTags[sansAccent(txt)] || n.color || 'var(--gold)'
  }));
  if (document.body.classList.contains('searching')) renderSearchTags();
  migrate(n);
  render();
  const c = grid.querySelector('.card[data-id="' + n.id + '"]');
  if (c) { c.classList.add('sel'); if (n.kind === 'device') c.classList.add('flipped'); }
  clearTimeout(saveT); saveT = setTimeout(save, 500);
}

/* =========================================================================
   6. POINT D'ACCROCHE POUR LES CORRECTIFS
   Tout bloc <script> collé à la fin de ce fichier peut passer par VB.
   ========================================================================= */
window.VB = {
  version: '2026-08-23',

  /* état vivant */
  get dataset(){ return dataset; },  set dataset(v){ dataset = v; },
  get board(){ return board; },      set board(v){ board = v; },
  get editing(){ return editing; },

  /* actions */
  save:   r => save(r),
  render: () => render(),
  nodes:  () => nodes(),
  migrate, newNode, el, ed, icon,

  /* tables modifiables : VB.GRADS.monDegrade = ['Nom','linear-gradient(…)',0] */
  GRADS, GLYPHS, FINISHES, SCALES, VIEWS,
  FRONT,            /* VB.FRONT.monType = (face, n) => {…} */
  BLANK,            /* gabarit d'une nouvelle carte de ce type */

  /* éléments du DOM */
  grid, sheet, menu,

  /* ajoute une évolution qui ne s'applique qu'une fois, même sur une base déjà remplie */
  addMigration(id, fn){
    if (MIGRATIONS.some(m => m[0] === id)) return false;
    MIGRATIONS.push([id, fn]);
    if (runMigrations()) { save(false); render(); }
    return true;
  },

  /* déclare un nouveau type de carte : rendu + entrée de menu + option du panneau */
  addKind(name, label, renderer, blank){
    FRONT[name] = renderer;
    if (blank) BLANK[name] = blank;
    if (!menu.querySelector('[data-kind="' + name + '"]')) {
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.kind = name; b.textContent = label;
      menu.appendChild(b);
    }
    const sel = document.getElementById('fKind');
    if (sel && !sel.querySelector('option[value="' + name + '"]')) {
      const o = document.createElement('option'); o.value = name; o.textContent = label; sel.appendChild(o);
    }
    render();
  },

  /* ajoute un bouton dans la barre d'outils d'une carte */
  addTool(kinds, act, label, handler){
    VB._tools = VB._tools || [];
    VB._tools.push({ kinds: [].concat(kinds), act, label, handler });
    render();
  },

  /* ajoute un champ au panneau Détails */
  addField(html){ const w = document.createElement('div'); w.innerHTML = html;
    const body = document.getElementById('sheetBody');
    while (w.firstChild) body.appendChild(w.firstChild); },

  /* injecte du style */
  css(text){ const st = document.createElement('style'); st.textContent = text; document.head.appendChild(st); },

  /* point d'entrée d'un correctif : s'exécute même s'il est collé après coup */
  _q: [], _on: false,
  ready(fn){ if (VB._on) { try { fn(); } catch(e){ console.warn('Correctif en échec', e); } } else VB._q.push(fn); }
};

function vbGo(){
  if (VB._on) return;
  VB._on = true;
  VB._q.splice(0).forEach(fn => { try { fn(); } catch(e){ console.warn('Correctif en échec', e); } });
  document.dispatchEvent(new CustomEvent('vb:ready'));
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', vbGo);
else setTimeout(vbGo, 0);

/* les boutons ajoutés par VB.addTool sont branchés ici */
grid.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn || !VB._tools) return;
  const t = VB._tools.find(x => x.act === btn.dataset.act); if (!t) return;
  const card = btn.closest('.card'); if (!card) return;
  const n = dataset.find(x => x.id === card.dataset.id); if (!n) return;
  t.handler(n, card);
});


document.getElementById('undoBtn').addEventListener('click', undo);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
    if (e.target.closest('[contenteditable],input,textarea,select')) return;
    e.preventDefault(); undo();
  }
});

if (fit) { document.body.classList.add('fit'); const fb = document.getElementById('fitBtn'); fb.classList.add('on'); fb.textContent = 'Quitter la vue'; }

document.body.dataset.edit = '';
if (window.matchMedia('(hover: none)').matches || 'ontouchstart' in window || navigator.maxTouchPoints > 0)
  document.body.dataset.touch = '1';
load();
</script>
